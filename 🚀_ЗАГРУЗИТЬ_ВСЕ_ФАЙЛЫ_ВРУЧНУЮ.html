<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузить все файлы на GitHub</title>
    <style>
        body { font-family: Arial; max-width: 1000px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; }
        .status { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .log { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .file-list { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .file-item { padding: 8px 0; border-bottom: 1px solid #dee2e6; }
        .file-item:last-child { border-bottom: none; }
        input[type="file"] { margin: 10px 0; }
        .file-input-group { margin: 15px 0; padding: 15px; background: #fff; border: 1px solid #dee2e6; border-radius: 5px; }
        .file-input-group label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Загрузить все файлы на GitHub</h1>
        <p><strong>Выберите файлы для загрузки:</strong></p>
        
        <div class="file-list">
            <div class="file-input-group">
                <label>1. index.html</label>
                <input type="file" id="indexHtml" accept=".html">
            </div>
            <div class="file-input-group">
                <label>2. admin.html</label>
                <input type="file" id="adminHtml" accept=".html">
            </div>
            <div class="file-input-group">
                <label>3. forms.html (или deepseek_htmlобщая.html)</label>
                <input type="file" id="formsHtml" accept=".html">
            </div>
            <div class="file-input-group">
                <label>4. auth.js</label>
                <input type="file" id="authJs" accept=".js">
            </div>
            <div class="file-input-group">
                <label>5. data.js</label>
                <input type="file" id="dataJs" accept=".js">
            </div>
            <div class="file-input-group">
                <label>6. admin.js</label>
                <input type="file" id="adminJs" accept=".js">
            </div>
            <div class="file-input-group">
                <label>7. vercel.json</label>
                <input type="file" id="vercelJson" accept=".json">
            </div>
            <div class="file-input-group">
                <label>8. package.json</label>
                <input type="file" id="packageJson" accept=".json">
            </div>
        </div>
        
        <button id="uploadBtn" onclick="uploadAllFiles()">Загрузить все файлы на GitHub</button>
        
        <div id="status" class="status info">Выберите файлы и нажмите кнопку загрузки</div>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        const token = 'YOUR_GITHUB_TOKEN_HERE';
        const repo = 'volkonskiy93-cyber/shooting-requests-system';
        const baseUrl = `https://api.github.com/repos/${repo}/contents`;
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        };
        
        const fileMap = {
            'index.html': 'indexHtml',
            'admin.html': 'adminHtml',
            'forms.html': 'formsHtml',
            'auth.js': 'authJs',
            'data.js': 'dataJs',
            'admin.js': 'adminJs',
            'vercel.json': 'vercelJson',
            'package.json': 'packageJson'
        };
        
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue';
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showStatus(msg, type) {
            document.getElementById('status').textContent = msg;
            document.getElementById('status').className = `status ${type}`;
        }
        
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file, 'UTF-8');
            });
        }
        
        async function uploadFile(fileName, content, message) {
            try {
                const b64 = btoa(unescape(encodeURIComponent(content)));
                
                let sha = null;
                try {
                    const checkResponse = await fetch(`${baseUrl}/${encodeURIComponent(fileName)}`, {
                        method: 'GET',
                        headers: headers
                    });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {}
                
                const body = {
                    message: message,
                    content: b64
                };
                if (sha) body.sha = sha;
                
                const uploadResponse = await fetch(`${baseUrl}/${encodeURIComponent(fileName)}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(body)
                });
                
                if (uploadResponse.ok) {
                    const result = await uploadResponse.json();
                    log(`✅ ${fileName} загружен (SHA: ${result.commit.sha.substring(0, 8)}...)`, 'success');
                    return true;
                } else {
                    const error = await uploadResponse.text();
                    log(`❌ Ошибка загрузки ${fileName}: ${error}`, 'error');
                    return false;
                }
            } catch (e) {
                log(`❌ Ошибка: ${e.message}`, 'error');
                return false;
            }
        }
        
        async function uploadAllFiles() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            showStatus('Загрузка файлов...', 'info');
            log('Начинаем загрузку всех файлов...', 'info');
            
            let success = 0;
            let fail = 0;
            
            for (const [fileName, inputId] of Object.entries(fileMap)) {
                const input = document.getElementById(inputId);
                if (!input.files || input.files.length === 0) {
                    log(`⚠️ ${fileName} не выбран, пропускаем`, 'error');
                    fail++;
                    continue;
                }
                
                try {
                    log(`Читаем ${fileName}...`, 'info');
                    const content = await readFile(input.files[0]);
                    log(`Загружаем ${fileName}...`, 'info');
                    const result = await uploadFile(fileName, content, `Update ${fileName}`);
                    if (result) {
                        success++;
                    } else {
                        fail++;
                    }
                    await new Promise(resolve => setTimeout(resolve, 500));
                } catch (e) {
                    log(`❌ Ошибка чтения ${fileName}: ${e.message}`, 'error');
                    fail++;
                }
            }
            
            btn.disabled = false;
            
            if (fail === 0) {
                showStatus(`✅ Все файлы успешно загружены! (${success} файлов)`, 'success');
                log('', 'info');
                log('Vercel автоматически пересоберет проект через 1-2 минуты', 'info');
                log('Ссылка: https://shooting-requests-system.vercel.app', 'info');
            } else {
                showStatus(`⚠️ Загружено: ${success}, Ошибок: ${fail}`, 'error');
            }
        }
    </script>
</body>
</html>
