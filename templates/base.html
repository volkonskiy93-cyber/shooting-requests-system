<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if block_search_indexing %}
    <meta name="robots" content="noindex, nofollow, noarchive">
    {% endif %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Система заявок на видеосъемку{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #f5f2eb;
            --bg-secondary: #ffffff;
            --bg-muted: #efebe4;
            --bg-elevated: rgba(255, 255, 255, 0.9);
            --accent-sunrise: #f0b35b;
            --accent-apricot: #f4c88a;
            --accent-dawn: #d98747;
            --text-primary: #111111;
            --text-secondary: #615c55;
            --text-muted: #928c83;
            --border-soft: rgba(17, 17, 17, 0.07);
            --border-strong: rgba(17, 17, 17, 0.12);
            --shadow-soft: 0 18px 48px rgba(17, 17, 17, 0.05);
            --shadow-card: 0 28px 72px rgba(17, 17, 17, 0.07);
            --radius-sm: 14px;
            --radius-md: 22px;
            --radius-lg: 32px;
            --radius-xl: 40px;
            --content-width: 1480px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        body.public-site {
            background:
                radial-gradient(circle at 18% 4%, rgba(240, 179, 91, 0.16), rgba(240, 179, 91, 0) 20%),
                radial-gradient(circle at 82% 8%, rgba(244, 200, 138, 0.16), rgba(244, 200, 138, 0) 22%),
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0) 30%),
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 28%),
                linear-gradient(180deg, #fcfbf8 0%, var(--bg-primary) 52%, #ece7de 100%);
        }

        body.public-site::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 42%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0));
            pointer-events: none;
            opacity: 1;
            z-index: -1;
        }

        body.admin-site {
            background: linear-gradient(135deg, #FFE5D9 0%, #FFD7BA 25%, #FFE5CC 50%, #FFF4E6 75%, #FFF8F0 100%);
            background-attachment: fixed;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .glass-input {
            background: var(--bg-secondary) !important;
            border: 1px solid var(--border-soft) !important;
            color: var(--text-primary) !important;
            backdrop-filter: none;
        }

        .glass-input:focus {
            background: var(--bg-secondary) !important;
            border-color: rgba(17, 17, 17, 0.22) !important;
        }

        @media (max-width: 768px) {
            body.public-site {
                background:
                    radial-gradient(circle at top, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0) 30%),
                    linear-gradient(180deg, #fcfbf8 0%, #f4f1eb 100%);
            }
        }
        
        {% block styles %}{% endblock %}
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% if request.endpoint == 'admin' %}admin-site{% else %}public-site{% endif %}">
    {% block content %}{% endblock %}
    <script>
        window.setCsrfToken = function (token) {
            const meta = document.querySelector('meta[name="csrf-token"]');
            if (meta && token) {
                meta.setAttribute('content', token);
            }
        };

        window.getCsrfToken = function () {
            return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        };

        window.refreshCsrfToken = async function () {
            const response = await fetch('/api/session/csrf', {
                method: 'GET',
                cache: 'no-store',
                credentials: 'same-origin',
            });
            const data = await response.json();
            if (data?.csrfToken) {
                window.setCsrfToken(data.csrfToken);
            }
            return data;
        };

        window.fetchWithCsrfRetry = async function (input, init = {}, retry = true) {
            const response = await fetch(input, init);
            if (!retry) {
                return response;
            }

            if (response.status !== 400) {
                return response;
            }

            const cloned = response.clone();
            let payload = {};
            try {
                payload = await cloned.json();
            } catch (error) {
                return response;
            }

            if (payload?.message !== 'Сессия устарела. Обновите страницу и повторите действие.') {
                return response;
            }

            await window.refreshCsrfToken();
            const nextInit = {
                ...init,
                headers: {
                    ...(init.headers || {}),
                    'X-CSRF-Token': window.getCsrfToken(),
                },
            };
            return fetch(input, nextInit);
        };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
