<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Полная загрузка всех файлов на GitHub</title>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; }
        .status { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .log { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .file-list { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 5px; }
        .file-item { padding: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Полная загрузка всех файлов на GitHub</h1>
        <p><strong>Этот инструмент загрузит все необходимые файлы проекта на GitHub</strong></p>
        
        <div class="file-list">
            <h3>Файлы для загрузки:</h3>
            <div class="file-item">✅ index.html</div>
            <div class="file-item">✅ admin.html</div>
            <div class="file-item">✅ forms.html (из deepseek_htmlобщая.html)</div>
            <div class="file-item">✅ auth.js</div>
            <div class="file-item">✅ data.js</div>
            <div class="file-item">✅ admin.js</div>
            <div class="file-item">✅ vercel.json</div>
            <div class="file-item">✅ package.json</div>
        </div>
        
        <button id="uploadBtn" onclick="uploadAllFiles()">Загрузить все файлы</button>
        
        <div id="status" class="status info">Нажмите кнопку для начала загрузки</div>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        const token = 'YOUR_GITHUB_TOKEN_HERE';
        const repo = 'volkonskiy93-cyber/shooting-requests-system';
        const baseUrl = `https://api.github.com/repos/${repo}/contents`;
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        };
        
        const filesToUpload = [
            'index.html',
            'admin.html',
            'auth.js',
            'data.js',
            'admin.js',
            'vercel.json',
            'package.json'
        ];
        
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue';
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logDiv.scrollHeight;
        }
        
        function showStatus(msg, type) {
            document.getElementById('status').textContent = msg;
            document.getElementById('status').className = `status ${type}`;
        }
        
        async function loadFile(fileName) {
            try {
                const response = await fetch(fileName);
                if (response.ok) {
                    return await response.text();
                }
                throw new Error(`HTTP ${response.status}`);
            } catch (e) {
                log(`❌ Не удалось загрузить ${fileName}: ${e.message}`, 'error');
                return null;
            }
        }
        
        async function uploadFile(fileName, content, message) {
            try {
                const b64 = btoa(unescape(encodeURIComponent(content)));
                
                let sha = null;
                try {
                    const checkResponse = await fetch(`${baseUrl}/${encodeURIComponent(fileName)}`, {
                        method: 'GET',
                        headers: headers
                    });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {}
                
                const body = {
                    message: message,
                    content: b64
                };
                if (sha) body.sha = sha;
                
                const uploadResponse = await fetch(`${baseUrl}/${encodeURIComponent(fileName)}`, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(body)
                });
                
                if (uploadResponse.ok) {
                    const result = await uploadResponse.json();
                    log(`✅ ${fileName} загружен (SHA: ${result.commit.sha.substring(0, 8)}...)`, 'success');
                    return true;
                } else {
                    const error = await uploadResponse.text();
                    log(`❌ Ошибка загрузки ${fileName}: ${error}`, 'error');
                    return false;
                }
            } catch (e) {
                log(`❌ Ошибка: ${e.message}`, 'error');
                return false;
            }
        }
        
        async function uploadAllFiles() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            showStatus('Загрузка файлов...', 'info');
            log('Начинаем загрузку всех файлов...', 'info');
            
            let success = 0;
            let fail = 0;
            
            // Загружаем обычные файлы
            for (const fileName of filesToUpload) {
                log(`Загрузка ${fileName}...`, 'info');
                const content = await loadFile(fileName);
                if (content) {
                    const result = await uploadFile(fileName, content, `Update ${fileName}`);
                    if (result) {
                        success++;
                    } else {
                        fail++;
                    }
                    await new Promise(resolve => setTimeout(resolve, 500));
                } else {
                    fail++;
                }
            }
            
            // Загружаем forms.html из deepseek_htmlобщая.html
            log('Загрузка forms.html из deepseek_htmlобщая.html...', 'info');
            const deepseekContent = await loadFile('deepseek_htmlобщая.html');
            if (deepseekContent) {
                const result = await uploadFile('forms.html', deepseekContent, 'Add forms.html - fix 404 error');
                if (result) {
                    success++;
                } else {
                    fail++;
                }
            } else {
                log('⚠️ deepseek_htmlобщая.html не найден, forms.html не будет загружен', 'error');
                fail++;
            }
            
            btn.disabled = false;
            
            if (fail === 0) {
                showStatus(`✅ Все файлы успешно загружены! (${success} файлов)`, 'success');
                log('', 'info');
                log('Vercel автоматически пересоберет проект через 1-2 минуты', 'info');
                log('Ссылка: https://shooting-requests-system.vercel.app', 'info');
            } else {
                showStatus(`⚠️ Загружено: ${success}, Ошибок: ${fail}`, 'error');
            }
        }
    </script>
</body>
</html>
