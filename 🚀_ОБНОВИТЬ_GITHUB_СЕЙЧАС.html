<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоматическое обновление файлов на GitHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(135deg, #FFE5D9 0%, #FFD7BA 25%, #FFE5CC 50%, #FFF4E6 75%, #FFF8F0 100%);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2C1810;
            margin-bottom: 30px;
            text-align: center;
        }
        button {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .success {
            background: linear-gradient(135deg, #52C41A 0%, #73D13D 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .error {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .info {
            background: rgba(74, 144, 226, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border-left: 4px solid #4A90E2;
        }
        .log {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Автоматическое обновление файлов на GitHub</h1>
        
        <div class="info">
            ⚠️ <strong>ВАЖНО:</strong> Этот файл должен быть открыт через локальный веб-сервер, 
            а не напрямую через file:// протокол!<br><br>
            Запустите в командной строке: <code>python -m http.server 8000</code><br>
            Затем откройте: <code>http://localhost:8000/🚀_ОБНОВИТЬ_GITHUB_СЕЙЧАС.html</code>
        </div>
        
        <button id="update-btn" onclick="updateAllFiles()">🔄 Обновить все файлы на GitHub</button>
        
        <div id="result"></div>
        <div id="log" class="log" style="display: none;"></div>
    </div>

    <script>
        const TOKEN = 'YOUR_GITHUB_TOKEN_HERE';
        const REPO_OWNER = 'volkonskiy93-cyber';
        const REPO_NAME = '-2';
        const BASE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            logDiv.innerHTML += message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function updateFile(fileName) {
            log(`📄 Обновление файла: ${fileName}`);
            
            try {
                // Загружаем локальный файл через XMLHttpRequest (работает с file://)
                const fileContent = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', fileName, true);
                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 0) {
                            resolve(xhr.responseText);
                        } else {
                            reject(new Error(`Не удалось загрузить файл: ${xhr.statusText}`));
                        }
                    };
                    xhr.onerror = function() {
                        reject(new Error('Ошибка сети при загрузке файла'));
                    };
                    xhr.send();
                });
                
                log(`  ✓ Файл загружен (${fileContent.length} символов)`);

                // Кодируем в base64
                const base64Content = btoa(unescape(encodeURIComponent(fileContent)));
                log(`  ✓ Файл закодирован в base64`);

                // Получаем SHA существующего файла (если есть)
                let sha = null;
                try {
                    const getUrl = `${BASE_URL}/${encodeURIComponent(fileName)}`;
                    const getResponse = await fetch(getUrl, {
                        method: 'GET',
                        headers: {
                            'Authorization': `token ${TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (getResponse.ok) {
                        const fileData = await getResponse.json();
                        sha = fileData.sha;
                        log(`  ✓ Найден существующий файл, SHA: ${sha.substring(0, 8)}...`);
                    }
                } catch (e) {
                    log(`  ℹ Файл не существует или ошибка получения SHA: ${e.message}`);
                }

                // Обновляем файл на GitHub
                const updateBody = {
                    message: 'Обновление стилей iOS 26',
                    content: base64Content
                };
                
                if (sha) {
                    updateBody.sha = sha;
                }
                
                const updateUrl = `${BASE_URL}/${encodeURIComponent(fileName)}`;
                const updateResponse = await fetch(updateUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateBody)
                });

                if (updateResponse.ok) {
                    const result = await updateResponse.json();
                    log(`  ✅ Файл успешно обновлен!`);
                    return { success: true, fileName };
                } else {
                    const errorText = await updateResponse.text();
                    let errorMessage = 'Ошибка обновления';
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.message || errorMessage;
                    } catch (e) {
                        errorMessage = errorText || errorMessage;
                    }
                    throw new Error(errorMessage);
                }
            } catch (error) {
                log(`  ❌ Ошибка: ${error.message}`);
                return { success: false, fileName, error: error.message };
            }
        }

        async function updateAllFiles() {
            const btn = document.getElementById('update-btn');
            const resultDiv = document.getElementById('result');
            const logDiv = document.getElementById('log');
            
            btn.disabled = true;
            btn.textContent = '⏳ Обновление...';
            resultDiv.className = '';
            resultDiv.style.display = 'none';
            logDiv.innerHTML = '';
            logDiv.style.display = 'block';
            
            log('🚀 Начало обновления файлов на GitHub...');
            log('');

            const files = [
                'index.html',
                'deepseek_htmlобщая.html',
                'admin.html'
            ];

            let successCount = 0;
            let errorCount = 0;
            const errors = [];

            for (const fileName of files) {
                const result = await updateFile(fileName);
                if (result.success) {
                    successCount++;
                } else {
                    errorCount++;
                    errors.push(`${result.fileName}: ${result.error}`);
                }
                log('');
                await new Promise(resolve => setTimeout(resolve, 1000)); // Задержка между запросами
            }

            log('═══════════════════════════════════════════════════');
            log(`📊 Результаты обновления:`);
            log(`  ✅ Успешно: ${successCount}`);
            log(`  ❌ Ошибок: ${errorCount}`);
            log('═══════════════════════════════════════════════════');

            btn.disabled = false;
            btn.textContent = '🔄 Обновить все файлы на GitHub';

            if (errorCount === 0) {
                resultDiv.className = 'success';
                resultDiv.style.display = 'block';
                resultDiv.textContent = `✅ Все файлы успешно обновлены! (${successCount} файлов)`;
            } else {
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `⚠️ Обновлено: ${successCount}, Ошибок: ${errorCount}<br>${errors.join('<br>')}`;
            }
        }

        // Проверяем, открыт ли файл через http:// или file://
        window.addEventListener('load', function() {
            if (window.location.protocol === 'file:') {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '❌ Файл открыт через file:// протокол!<br><br>' +
                    'Запустите локальный веб-сервер:<br>' +
                    '<code>python -m http.server 8000</code><br><br>' +
                    'Затем откройте: <code>http://localhost:8000/🚀_ОБНОВИТЬ_GITHUB_СЕЙЧАС.html</code>';
                document.getElementById('update-btn').disabled = true;
            } else {
                // Автоматически запускаем обновление при загрузке страницы
                setTimeout(updateAllFiles, 1000);
            }
        });
    </script>
</body>
</html>
