<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузить forms.html на GitHub</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; }
        .status { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .log { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        input[type="file"] { margin: 20px 0; padding: 10px; width: 100%; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .warning { background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Загрузить forms.html на GitHub</h1>
        
        <div class="warning">
            <strong>⚠️ ВАЖНО:</strong> Выберите файл <code>deepseek_htmlобщая.html</code> или <code>forms.html</code>
        </div>
        
        <p><strong>Инструкция:</strong></p>
        <ol>
            <li>Нажмите "Выбрать файл" ниже</li>
            <li>Выберите файл <code>deepseek_htmlобщая.html</code> или <code>forms.html</code></li>
            <li>Нажмите "Загрузить на GitHub"</li>
        </ol>
        
        <input type="file" id="fileInput" accept=".html">
        <button id="uploadBtn" onclick="uploadFile()" disabled>Загрузить на GitHub</button>
        
        <div id="status" class="status info">Выберите файл для загрузки</div>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        const token = 'YOUR_GITHUB_TOKEN_HERE';
        const repo = 'volkonskiy93-cyber/shooting-requests-system';
        const baseUrl = `https://api.github.com/repos/${repo}/contents`;
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        };
        
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                uploadBtn.disabled = false;
                showStatus(`Выбран файл: ${this.files[0].name}`, 'info');
            } else {
                uploadBtn.disabled = true;
            }
        });
        
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue';
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showStatus(msg, type) {
            document.getElementById('status').textContent = msg;
            document.getElementById('status').className = `status ${type}`;
        }
        
        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) {
                showStatus('❌ Выберите файл', 'error');
                return;
            }
            
            uploadBtn.disabled = true;
            showStatus('Чтение файла...', 'info');
            log(`Читаем файл: ${file.name}`, 'info');
            
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const content = e.target.result;
                log(`✅ Файл прочитан (${content.length} символов)`, 'success');
                
                if (content.trim().length === 0) {
                    log('❌ Файл пустой! Выберите другой файл.', 'error');
                    showStatus('❌ Файл пустой! Выберите deepseek_htmlобщая.html', 'error');
                    uploadBtn.disabled = false;
                    return;
                }
                
                const b64 = btoa(unescape(encodeURIComponent(content)));
                log('Файл закодирован в base64', 'info');
                
                let sha = null;
                try {
                    log('Проверяем существование файла на GitHub...', 'info');
                    const checkResponse = await fetch(`${baseUrl}/forms.html`, { method: 'GET', headers });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                        log('Файл существует на GitHub, обновляем...', 'info');
                    } else {
                        log('Создаем новый файл...', 'info');
                    }
                } catch (e) {
                    log('Создаем новый файл...', 'info');
                }
                
                log('Загрузка на GitHub...', 'info');
                const body = {
                    message: 'Add/Update forms.html - fix page not working',
                    content: b64
                };
                if (sha) body.sha = sha;
                
                try {
                    const uploadResponse = await fetch(`${baseUrl}/forms.html`, {
                        method: 'PUT',
                        headers,
                        body: JSON.stringify(body)
                    });
                    
                    if (uploadResponse.ok) {
                        const result = await uploadResponse.json();
                        log('✅ Файл успешно загружен на GitHub!', 'success');
                        log(`Commit SHA: ${result.commit.sha.substring(0, 8)}...`, 'success');
                        showStatus('✅ forms.html успешно загружен! Vercel пересоберет проект через 1-2 минуты.', 'success');
                        log('', 'info');
                        log('Ссылка: https://shooting-requests-system.vercel.app', 'info');
                        log('Подождите 1-2 минуты и проверьте проект', 'info');
                        uploadBtn.disabled = false;
                    } else {
                        const error = await uploadResponse.text();
                        log(`❌ Ошибка загрузки: ${error}`, 'error');
                        showStatus('❌ Ошибка загрузки', 'error');
                        uploadBtn.disabled = false;
                    }
                } catch (e) {
                    log(`❌ Ошибка: ${e.message}`, 'error');
                    showStatus('❌ Ошибка загрузки', 'error');
                    uploadBtn.disabled = false;
                }
            };
            
            reader.onerror = function() {
                log('❌ Ошибка чтения файла', 'error');
                showStatus('❌ Ошибка чтения файла', 'error');
                uploadBtn.disabled = false;
            };
            
            reader.readAsText(file, 'UTF-8');
        }
    </script>
</body>
</html>
